name: Build release binaries

# Called by release.yml right after semantic-release publishes a release.
# Builds each required target in release mode, packages the binary, and
# attaches it to the GitHub Release that already exists for the tag.
#
# Deliberately NOT triggered by `push: tags`: relying on the tag semantic-release
# pushes to fire a second workflow silently failed for every release after
# v0.1.0 (no binaries were ever attached). Calling it explicitly doesn't depend
# on token/anti-recursion behaviour. Run it manually (workflow_dispatch) with a
# tag to backfill binaries for an existing release.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and attach binaries to (e.g. v0.2.2)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach binaries to (e.g. v0.2.2)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
        include:
          - target: x86_64-unknown-linux-gnu
            arch: linux-amd64
          - target: aarch64-unknown-linux-gnu
            arch: linux-aarch64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: ./.github/actions/rust-bpf-setup
        with:
          target: ${{ matrix.target }}

      # --exclude linux-game-haptics-router-ebpf: it's #![no_std]#![no_main] with its own
      # #[panic_handler] and can only build correctly through aya-build's
      # bpfel-unknown-none cross-compile (invoked from linux-game-haptics-router's
      # build.rs, which still runs and produces the real embedded bytecode
      # regardless of this exclude) — building it directly for a real target
      # links std and collides with its panic_handler (E0152).
      - run: cargo build --workspace --exclude linux-game-haptics-router-ebpf --release --target ${{ matrix.target }}

      - name: Package
        run: |
          pkg=game-haptics-router-${{ inputs.tag }}-${{ matrix.arch }}
          mkdir -p "$pkg"
          cp target/${{ matrix.target }}/release/game-haptics-router "$pkg/"
          tar czf "$pkg.tar.gz" "$pkg"
          sha256sum "$pkg.tar.gz" > "$pkg.tar.gz.sha256"

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          # softprops defaults draft to false and would publish the release on
          # the first matrix job's upload, locking out the other arch (immutable
          # releases). release.yml's `publish` job does the publishing.
          draft: true
          files: |
            game-haptics-router-${{ inputs.tag }}-${{ matrix.arch }}.tar.gz
            game-haptics-router-${{ inputs.tag }}-${{ matrix.arch }}.tar.gz.sha256
